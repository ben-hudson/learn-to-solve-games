[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-to-solve-games"
version = "0.1.0"
description = "Learn to solve games."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cooper-optim",
    "lightning",
    "matplotlib",
    "numpy",
    "torch_geometric",
    "torch~=2.7.0",
    "torchvision",
    "wandb",
    "scipy",
    # StandardScaler.partial_fit, for the streaming normalizer fit (see data.Standardizer.fit_iter).
    # Already present transitively via route-choice; declared so a release of that dropping it cannot
    # break this import silently.
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]
